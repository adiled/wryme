name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  desktop:
    needs: [publish-crate]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: wryme-darwin-arm64.zip
            package: desktop/package-macos.sh
          - os: windows-latest
            artifact: wryme-windows-x86_64.zip
            package: desktop/package-windows.sh
          - os: ubuntu-22.04
            artifact: wryme-linux-x86_64.deb
            package: desktop/package-linux.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check desktop drift vs previous release
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          PREV="$(gh release list --limit 30 --json tagName --jq '.tagName[]' | sed "/^${REF}$/d" | head -1)"
          CHANGED="1"
          if [[ -n "${PREV:-}" ]]; then
            if gh release view "$PREV" --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ matrix.artifact }}"; then
              if git diff --quiet "$PREV" "$REF" -- desktop/; then
                CHANGED="0"
              fi
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "desktop drift vs $PREV: changed=$CHANGED"

      - name: Reuse previous release bundle
        if: steps.drift.outputs.changed == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.drift.outputs.prev }}" --pattern "${{ matrix.artifact }}" --dir .
          ls -la "${{ matrix.artifact }}"

      - name: Package desktop bundle
        if: steps.drift.outputs.changed == '1'
        run: |
          BUNDLE_VERSION="$(date +%Y.%m.%d)"
          bash "${{ matrix.package }}" "$BUNDLE_VERSION"
          ls -la dist/* wryme* *.zip *.tar.gz *.deb 2>/dev/null || true
          for f in dist/*.zip dist/*.tar.gz dist/*.deb; do [[ -f "$f" ]] && cp "$f" . 2>/dev/null || true; done
          ls -la *.zip *.tar.gz *.deb 2>/dev/null || true

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [publish-crate, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create GitHub release with bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=()
          for f in bundles/*.zip bundles/*.tar.gz bundles/*.deb; do
            [[ -f "$f" ]] && FILES+=("$f")
          done
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${FILES[@]}"
