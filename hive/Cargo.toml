[package]
name = "wryme-hive"
version = "1.8.0"
edition = "2024"
license = "MIT"
description = "wryme-hive — wryme's tool surface (shell, explore, check, book) as a hum forager bee. humd routes chi:tool-call here; we run them on this machine."

[dependencies]
wryme = { path = ".." }
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-nest = { git = "https://github.com/adiled/hum.git", branch = "main" }

tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[[bin]]
name = "wryme-hive"
path = "src/main.rs"

[workspace]
