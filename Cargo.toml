[package]
name = "wryme"
version = "1.1.4"
edition = "2021"
license = "MIT"
description = "wryme • that small, calm window where agents come to meet you"
repository = "https://github.com/adiled/wryme"
homepage = "https://github.com/adiled/wryme"
documentation = "https://github.com/adiled/wryme#readme"
readme = "README.md"
keywords = ["tui", "terminal", "chat", "ai", "agent"]
categories = ["command-line-interface"]

[[bin]]
name = "wme"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-markdown = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parquet = "53"
arrow-array = "53"
arrow-schema = "53"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
