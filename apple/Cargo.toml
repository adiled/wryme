[package]
name = "wryme-apple"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "wryme core linked into the iOS app, and the Swift parity checks"
publish = false

[lib]
name = "wryme_apple"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
wryme = { path = ".." }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
ratatui = { version = "0.30", default-features = false }
serde = "1"
serde_json = "1"
