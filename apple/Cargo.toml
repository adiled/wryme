[package]
name = "wryme-apple"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "wryme core for the macOS and iOS apps"
publish = false

[lib]
name = "wryme_apple"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
wryme = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
